<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş Hafıza Kart Oyunu (1-4 Oyuncu Seçenekli)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: var(--bg-color, #dc2626);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px;
            transition: background 0.4s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
            width: 100%;
            max-width: 900px;
        }

        h1 {
            font-size: 22px;
            color: #ffffff;
            margin-bottom: 5px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        .top-panel {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        button:hover {
            background: #0369a1;
        }

        button.active {
            background: #10b981;
        }

        .players-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-bottom: 8px;
        }

        .player-badge {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: rgba(0, 0, 0, 0.4);
            color: #ffffff;
            transition: transform 0.2s;
        }

        .player-badge.active-player {
            transform: scale(1.08);
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.7);
        }

        .info-bar {
            font-size: 13px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 14px;
            border-radius: 6px;
            display: inline-flex;
            gap: 15px;
            justify-content: center;
            font-weight: bold;
            backdrop-filter: blur(4px);
        }

        .game-board {
            display: grid;
            gap: 6px;
            width: 100%;
            max-width: 900px;
            perspective: 1000px;
            margin-bottom: 15px;
        }

        .board-phone { grid-template-columns: repeat(4, 1fr); }
        .board-tablet { grid-template-columns: repeat(6, 1fr); }
        .board-pc { grid-template-columns: repeat(8, 1fr); }

        .card {
            aspect-ratio: 1;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            transform: rotateY(180deg);
            cursor: default;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }

        .card-front {
            background: linear-gradient(135deg, #1e293b, #334155);
            border: 2px solid #475569;
            color: #38bdf8;
            font-weight: bold;
        }

        .card-back {
            background: #1e1b4b;
            border: 2px solid #6366f1;
            transform: rotateY(180deg);
        }

        /* Eşleşen kartlarda emoji silinmez, sağ üst köşesine yeşil dairesel tik rozeti gelir */
        .card.matched .card-back {
            background: #2e1065;
            border-color: #a855f7;
            opacity: 0.85;
        }

        .card.matched::after {
            content: '✓';
            position: absolute;
            top: 4px;
            right: 4px;
            background: #22c55e;
            color: #ffffff;
            font-size: 12px;
            font-weight: 900;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Modal Pencereleri */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            border: 2px solid #38bdf8;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            max-width: 420px;
            width: 90%;
            color: #f8fafc;
        }

        .modal-card h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #38bdf8;
        }

        .setting-row {
            margin-bottom: 15px;
            text-align: left;
        }

        .setting-row label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .setting-opts {
            display: flex;
            gap: 6px;
        }

        .setting-opts button {
            flex: 1;
            padding: 8px 4px;
            font-size: 12px;
        }

        .close-btn {
            background: #ef4444;
            margin-top: 10px;
            width: 100%;
        }

        .close-btn:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🧠 Hafıza Kart Oyunu</h1>
        
        <div class="top-panel">
            <button onclick="openSettings()">⚙️ Ayarlar</button>
            <button onclick="resetGame()">🔄 Oyunu Sıfırla</button>
        </div>

        <div class="players-bar" id="playersBar">
            <!-- Oyuncu skor kutucukları dinamik yüklenir -->
        </div>

        <div class="info-bar">
            <div>Sıra: <span id="currentTurn">1. Oyuncu</span></div>
            <div>⏳ Oturum Kalan: <span id="countdown">05:00:00</span></div>
        </div>
    </div>

    <div class="game-board board-pc" id="board"></div>

    <!-- Ayarlar Menüsü Modalı -->
    <div id="settingsModal" class="modal-overlay">
        <div class="modal-card">
            <h2>⚙️ Oyun Ayarları</h2>
            
            <div class="setting-row">
                <label>Oyuncu Sayısı (Kart Adedi Otomatik Ayarlanır):</label>
                <div class="setting-opts">
                    <button id="btnP1" onclick="setPlayerCount(1)">1 Oyuncu (14 Kart)</button>
                    <button id="btnP2" onclick="setPlayerCount(2)">2 Oyuncu (22 Kart)</button>
                    <button id="btnP3" onclick="setPlayerCount(3)">3 Oyuncu (26 Kart)</button>
                    <button id="btnP4" onclick="setPlayerCount(4)">4 Oyuncu (36 Kart)</button>
                </div>
            </div>

            <div class="setting-row">
                <label>Cihaz / Ekran Düzeni:</label>
                <div class="setting-opts">
                    <button id="btnPhone" onclick="setDevice('phone')">📱 Telefon</button>
                    <button id="btnTablet" onclick="setDevice('tablet')">Tablet</button>
                    <button id="btnPC" onclick="setDevice('pc')">💻 PC</button>
                </div>
            </div>

            <div class="setting-row">
                <label>Arka Plan Müzik / Ses:</label>
                <button onclick="toggleAudio()" id="audioBtn" style="width: 100%;">🎵 Ses: Kapalı</button>
            </div>

            <button class="close-btn" onclick="closeSettings()">Kapat ✖</button>
        </div>
    </div>

    <!-- Kazanma Modalı -->
    <div id="winModal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="winnerText" style="font-size: 24px;">1. Oyuncu Kazandı!</h2>
            <p id="winnerScore" style="color: #cbd5e1; font-size: 14px; margin-bottom: 15px;"></p>
            <button onclick="closeWinModal()" style="background: #10b981; width: 100%;">Tebrikler! Yeni Oyun 🎮</button>
        </div>
    </div>

    <script>
        const allIcons = ['⚔️', '🛡️', '💎', '🍎', '🏹', '🔥', '🌊', '⚡', '👑', '🔑', '🚀', '⭐', '🍀', '🐉', '👻', '🍕', '🐱', '🐶', '🦊', '🐼', '🦄', '⚽', '🏀', '🚗', '✈️', '🎸', '🎨', '🧸', '🍔', '🍦', '🍩', '🍫', '⌚', '💡', '💻', '📞', '🔋', '🎁', '🎈', '🏆', '🎯', '🧩', '🎲', '🛹', '🚲', '⚓', '🌵', '🌺', '🍎', '🍉'];
        
        let currentDevice = 'pc';
        let playerCount = 4; // Varsayılan 4 oyuncu
        let cardCount = 36; // 4 oyuncu için 36 kart
        let icons = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let lockBoard = false;

        let activePlayer = 1; 
        let scores = { 1: 0, 2: 0, 3: 0, 4: 0 };

        const playerBackgrounds = {
            1: '#dc2626', // Kırmızı
            2: '#d97706', // Sarı
            3: '#16a34a', // Yeşil
            4: '#2563eb'  // Mavi
        };

        const playerNames = {
            1: '1. Oyuncu (Kırmızı)',
            2: '2. Oyuncu (Sarı)',
            3: '3. Oyuncu (Yeşil)',
            4: '4. Oyuncu (Mavi)'
        };

        let audioCtx = null;
        let isAudioPlaying = false;
        let melodyInterval = null;

        const TOTAL_SESSION_TIME = 18000;
        let sessionStartTime = localStorage.getItem('memory_4p_session');
        if (!sessionStartTime) {
            sessionStartTime = Date.now();
            localStorage.setItem('memory_4p_session', sessionStartTime);
        }

        function openSettings() {
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        // Oyuncu Sayısı Seçimi (1, 2, 3, 4 Oyuncu)
        function setPlayerCount(count) {
            playerCount = count;
            
            // Oyuncu sayısına göre kart adetleri
            if (count === 1) cardCount = 14;
            else if (count === 2) cardCount = 22;
            else if (count === 3) cardCount = 26;
            else if (count === 4) cardCount = 36;

            [1, 2, 3, 4].forEach(p => {
                const btn = document.getElementById(`btnP${p}`);
                if (btn) btn.classList.remove('active');
            });
            document.getElementById(`btnP${count}`).classList.add('active');

            resetGame();
        }

        function setDevice(device) {
            currentDevice = device;
            const board = document.getElementById('board');
            board.className = 'game-board';

            document.getElementById('btnPhone').classList.remove('active');
            document.getElementById('btnTablet').classList.remove('active');
            document.getElementById('btnPC').classList.remove('active');

            if (device === 'phone') {
                board.classList.add('board-phone');
                document.getElementById('btnPhone').classList.add('active');
            } else if (device === 'tablet') {
                board.classList.add('board-tablet');
                document.getElementById('btnTablet').classList.add('active');
            } else {
                board.classList.add('board-pc');
                document.getElementById('btnPC').classList.add('active');
            }
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function resetGame() {
            matchedPairs = 0;
            flippedCards = [];
            lockBoard = false;
            activePlayer = 1;
            scores = { 1: 0, 2: 0, 3: 0, 4: 0 };
            
            renderPlayerBadges();
            updateScoreboard();

            const pairCount = cardCount / 2;
            let selectedIcons = allIcons.slice(0, pairCount);
            icons = [...selectedIcons, ...selectedIcons];
            shuffle(icons);

            const board = document.getElementById('board');
            board.innerHTML = '';

            icons.forEach((icon, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.icon = icon;

                card.innerHTML = `
                    <div class="card-face card-front">?</div>
                    <div class="card-face card-back">${icon}</div>
                `;

                card.addEventListener('click', () => flipCard(card));
                board.appendChild(card);
            });
        }

        function renderPlayerBadges() {
            const bar = document.getElementById('playersBar');
            bar.innerHTML = '';
            for (let p = 1; p <= playerCount; p++) {
                const div = document.createElement('div');
                div.id = `p${p}Badge`;
                div.className = 'player-badge';
                div.innerHTML = `${playerNames[p]}: <span id="p${p}Score">0</span> Çift`;
                bar.appendChild(div);
            }
        }

        function flipCard(card) {
            if (lockBoard || card.classList.contains('flipped') || card.classList.contains('matched')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            lockBoard = true;
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.icon === card2.dataset.icon;

            if (isMatch) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    matchedPairs++;
                    scores[activePlayer]++;
                    updateScoreboard();
                    resetTurn();

                    const totalPairsNeeded = cardCount / 2;
                    if (matchedPairs === totalPairsNeeded) {
                        handleGameOver();
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    nextPlayer();
                    resetTurn();
                }, 900);
            }
        }

        function handleGameOver() {
            playWinSound();

            let maxScore = -1;
            let winnerPlayer = 1;
            for (let p = 1; p <= playerCount; p++) {
                if (scores[p] > maxScore) {
                    maxScore = scores[p];
                    winnerPlayer = p;
                }
            }

            const modal = document.getElementById('winModal');
            const winnerText = document.getElementById('winnerText');
            const winnerScore = document.getElementById('winnerScore');

            if (playerCount === 1) {
                winnerText.innerText = `Tebrikler! Oyunu Tamamladın!`;
                winnerText.style.color = '#10b981';
                winnerScore.innerText = `Toplam Toplanan Çift Sayısı: ${maxScore}`;
            } else {
                winnerText.innerText = `${playerNames[winnerPlayer]} Kazandı!`;
                winnerText.style.color = playerBackgrounds[winnerPlayer];
                winnerScore.innerText = `Toplam Toplanan Çift Sayısı: ${maxScore}`;
            }

            modal.style.display = 'flex';
        }

        function closeWinModal() {
            document.getElementById('winModal').style.display = 'none';
            resetGame();
        }

        function nextPlayer() {
            activePlayer = activePlayer >= playerCount ? 1 : activePlayer + 1;
            updateScoreboard();
        }

        function updateScoreboard() {
            for (let p = 1; p <= playerCount; p++) {
                const el = document.getElementById(`p${p}Score`);
                if (el) el.innerText = scores[p];

                const badge = document.getElementById(`p${p}Badge`);
                if (badge) {
                    if (p === activePlayer) {
                        badge.classList.add('active-player');
                    } else {
                        badge.classList.remove('active-player');
                    }
                }
            }

            document.documentElement.style.setProperty('--bg-color', playerBackgrounds[activePlayer]);
            document.getElementById('currentTurn').innerText = playerNames[activePlayer];
        }

        function resetTurn() {
            flippedCards = [];
            lockBoard = false;
        }

        function playWinSound() {
            try {
                const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
                const winNotes = [330, 392, 659, 523, 587, 784];
                winNotes.forEach((freq, index) => {
                    const osc = tempCtx.createOscillator();
                    const gain = tempCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, tempCtx.currentTime + (index * 0.12));
                    gain.gain.setValueAtTime(0.8, tempCtx.currentTime + (index * 0.12));
                    gain.gain.exponentialRampToValueAtTime(0.01, tempCtx.currentTime + (index * 0.12) + 0.3);
                    osc.connect(gain);
                    gain.connect(tempCtx.destination);
                    osc.start(tempCtx.currentTime + (index * 0.12));
                    osc.stop(tempCtx.currentTime + (index * 0.12) + 0.3);
                });
            } catch(e) {}
        }

        setInterval(() => {
            const elapsedSeconds = Math.floor((Date.now() - sessionStartTime) / 1000);
            let remainingSeconds = TOTAL_SESSION_TIME - elapsedSeconds;

            if (remainingSeconds <= 0) {
                localStorage.removeItem('memory_4p_session');
                location.reload();
                return;
            }

            const hours = Math.floor(remainingSeconds / 3600).toString().padStart(2, '0');
            const mins = Math.floor((remainingSeconds % 3600) / 60).toString().padStart(2, '0');
            const secs = (remainingSeconds % 60).toString().padStart(2, '0');
            document.getElementById('countdown').innerText = `${hours}:${mins}:${secs}`;
        }, 1000);

        function toggleAudio() {
            const btn = document.getElementById('audioBtn');
            if (!isAudioPlaying) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    isAudioPlaying = true;
                    btn.innerText = "🎵 Ses: Açık";
                    btn.classList.add('active');
                    startMelodyLoop();
                } catch(e) {
                    alert("Tarayıcınız ses çalmayı desteklemiyor.");
                }
            } else {
                if (audioCtx) audioCtx.suspend();
                isAudioPlaying = false;
                clearInterval(melodyInterval);
                btn.innerText = "🎵 Ses: Kapalı";
                btn.classList.remove('active');
            }
        }

        function startMelodyLoop() {
            const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
            let i = 0;
            
            melodyInterval = setInterval(() => {
                if (!isAudioPlaying || !audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(notes[i % notes.length], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.95);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.95);
                    i++;
                } catch(e) {}
            }, 1000);
        }

        // Başlangıç Ayarları (4 Oyuncu, PC Modu)
        setPlayerCount(4);
        setDevice('pc');
    </script>
</body>
</html>
